# Mantém o site "quente": chama /api/aquecer depois de cada deploy de produção. O aquecimento de 5 em 5 minutos do banco
# (pg_cron no Supabase) foi DESLIGADO em 06/11/2026 (ver supabase/migrations/*_desligar_aquecimento_site_5min.sql): no plano
# gratuito da Vercel ele pesa no limite de uso. O agendamento abaixo (reserva) segue como está. A rota deixa um servidor da Vercel com as bases do SAP,
# os cadastros e os indicadores já baixados e preparados na memória (a primeira tela não espera o download).
# A rota não devolve dados, só o tempo de cada etapa. Endereço: variável SITE_URL do repositório (se houver).
name: Aquecer o site

on:
  schedule:
    - cron: "*/5 * * * *"
  # logo depois de cada deploy de produção (todas as instâncias novas começam frias)
  deployment_status:
  workflow_dispatch:

permissions: {}

jobs:
  aquecer:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Chamar /api/aquecer
        env:
          SITE: ${{ vars.SITE_URL || 'https://estoquemanutencao.vercel.app' }}
        run: |
          curl -sS --max-time 150 --retry 2 --retry-delay 10 -o resposta.json -w "HTTP %{http_code} em %{time_total}s\n" "$SITE/api/aquecer" || true
          cat resposta.json || true
