[project]
name = "central-manutencao"
version = "0.1.0"
description = "Central de Manutenção PCM F26: ordens IW38, estoque MB52, equipamentos e requisições, com atualização automática."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25 ; sys_platform == 'win32'",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pywin32>=306 ; sys_platform == 'win32'",
    "requests>=2.34.0",
    "streamlit>=1.60.0",
    "xlrd>=2.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
