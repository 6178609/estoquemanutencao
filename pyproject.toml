[project]
name = "central-manutencao"
version = "0.1.0"
description = "Central de Manutenção PCM F26 — parte do PC: sincronizador dos exports do SAP e robô do SAP (o site fica em web/)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "keyring>=25 ; sys_platform == 'win32'",
    "lxml>=6.1.3",
    "numpy>=2",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pyarrow>=18",
    "python-calamine>=0.4",
    "pywin32>=306 ; sys_platform == 'win32'",
    "requests>=2.34.0",
    "xlrd>=2.0.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
